<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>
    <style>
        .box {
            width: 200px;         /* Content width */
            height: 100px;        /* Content height */
            padding: 20px;        /* Space between content and border */
            border: 5px solid blue;   /* Border thickness, style and color */
            margin: 15px;         /* Space outside the border */
            background-color: #90EE90;  /* Light green background for padding area */
        }

        .content {
            background-color: white;  /* White background for content */
            height: 100%;            /* Fill the content area */
            width: 100%;             /* Fill the content area */
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="content">
            Your content here
        </div>
    </div>
</body>
</html>
